version: '3.8'

services:
  easevote-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easevote-app
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: easevote-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    depends_on:
      - easevote-backend
    restart: unless-stopped

