services:
  easevote-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easevote-app
    expose:
      - "5000"
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: easevote-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - easevote-backend
    restart: unless-stopped
