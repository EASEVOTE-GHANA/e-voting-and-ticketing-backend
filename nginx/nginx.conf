events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name api.easevotegh.com;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.easevotegh.com;

        ssl_certificate /etc/letsencrypt/live/api.easevotegh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.easevotegh.com/privkey.pem;

        location / {
            proxy_pass http://easevote-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
